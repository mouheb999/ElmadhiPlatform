<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Flouci">
  <title>Flouci</title>
  <!--
    Flouci, redrawn from the app icon to identify the payment method at 36px.
    Trademark of Flouci. Orange gradient tile, an open white ring with a dot
    closing the gap at the top, and the white petal inside it.
  -->
  <defs>
    <linearGradient id="flouci-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B172"/>
      <stop offset="0.55" stop-color="#E88A4E"/>
      <stop offset="1" stop-color="#D95F2C"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#flouci-bg)"/>
  <!-- The ring, opened at the top so the dot can sit in the gap. -->
  <path d="M22.6 21.6a15 15 0 1 0 18.8 0"
        fill="none" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round"/>
  <circle cx="32" cy="19.4" r="4.6" fill="#FFFFFF"/>
  <!-- The petal: round at the lower right, drawn to a point at the upper left. -->
  <path d="M38.4 32.1c2.5 2.5 2.2 6.1-.3 8.1-2.5 2-6.1 1.6-8.1-.9z" fill="#FFFFFF"/>
</svg>
